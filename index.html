<!DOCTYPE html>

        input:focus { outline: none; box-shadow: 0 0 0 2px rgba(255,71,87,0.3); }

    <script>
        // ========== 配置区 ==========
        const SUPABASE_URL = 'https://sghmaqzhqrxmqvewfilq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNnaG1hcXpoZXJ4bXF2ZXdmaWxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDc0NzkwMjAsImV4cCI6MjA2MzA1NTAyMH0.F8xG-E_7kLYT4R5v7M9n3qZ7h8xJ2qX5wU9vN6yT8cI';
        const ADMIN_PASSWORD = 'admin2024';

        // ========== 状态 ==========
        let currentUser = null;
        let currentUserId = null;
        let isAdmin = false;
        let currentView = 'self'; // 'self' or 'all'
        let selectedStaffId = null;
        let stores = [];
        let orders = [];
        let allUsers = [];
        let charts = {};
        let today = new Date().toISOString().split('T')[0];
        let deleteTarget = { type: null, id: null };

        // ========== 工具函数 ==========
        const f = n => (n || 0).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        const fmtNum = n => (n || 0).toLocaleString();

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2000);
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        // ========== Supabase API ==========
        async function supabaseRequest(table, options = {}) {
            const { method = 'GET', body = null, params = {} } = options;
            let url = `${SUPABASE_URL}/rest/v1/${table}`;
            
            const urlParams = new URLSearchParams();
            Object.entries(params).forEach(([k, v]) => urlParams.set(k, v));
            if (urlParams.toString()) url += '?' + urlParams.toString();

            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json'
            };
            if (method !== 'GET') headers['Prefer'] = 'return=representation';

            const config = { method, headers };
            if (body) config.body = JSON.stringify(body);

            const res = await fetch(url, config);
            if (!res.ok) throw new Error(await res.text());
            return method === 'DELETE' ? null : res.json();
        }

        // ========== 认证 ==========
        function showLogin() {
            ['loginPage', 'registerPage', 'adminLoginPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('loginPage').classList.remove('hidden');
        }
        function showRegister() {
            ['loginPage', 'registerPage', 'adminLoginPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('registerPage').classList.remove('hidden');
        }
        function showAdminLogin() {
            ['loginPage', 'registerPage', 'adminLoginPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('adminLoginPage').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
        }

        async function handleRegister() {
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            
            if (!username || !password) return showToast('请填写完整');
            
            try {
                // 检查用户名是否存在
                const existing = await supabaseRequest('users', { 
                    params: { username: `eq.${username}`, select: 'id' } 
                });
                if (existing.length > 0) return showToast('用户名已存在');

                // 创建用户
                const newUser = await supabaseRequest('users', {
                    method: 'POST',
                    body: { username, password, is_admin: false }
                });

                showToast('注册成功！请登录');
                showLogin();
                document.getElementById('loginUsername').value = username;
            } catch (e) {
                showToast('注册失败');
                console.error(e);
            }
        }

        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if (!username || !password) return showToast('请填写完整');
            
            try {
                const users = await supabaseRequest('users', { 
                    params: { username: `eq.${username}`, password: `eq.${password}`, select: '*' } 
                });
                
                if (users.length === 0) return showToast('用户名或密码错误');
                
                currentUser = username;
                currentUserId = users[0].id;
                isAdmin = false;
                localStorage.setItem('pdd_user', username);
                localStorage.setItem('pdd_user_id', currentUserId);
                
                showMainPage();
                showToast(`欢迎，${username}！`);
            } catch (e) {
                showToast('登录失败');
                console.error(e);
            }
        }

        async function handleAdminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password !== ADMIN_PASSWORD) return showToast('密码错误');
            
            currentUser = '管理员';
            currentUserId = null;
            isAdmin = true;
            localStorage.setItem('pdd_admin', 'true');
            
            showMainPage();
            showToast('欢迎，管理员！');
        }

        function handleLogout() {
            currentUser = null;
            currentUserId = null;
            isAdmin = false;
            localStorage.removeItem('pdd_user');
            localStorage.removeItem('pdd_user_id');
            localStorage.removeItem('pdd_admin');
            showLogin();
        }

        function showMainPage() {
            ['loginPage', 'registerPage', 'adminLoginPage'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById('mainPage').classList.remove('hidden');
            
            document.getElementById('navUsername').textContent = isAdmin ? '管理员' : currentUser;
            document.getElementById('viewToggle').classList.toggle('hidden', !isAdmin);
            
            if (isAdmin) {
                renderAdminViewToggle();
                loadAllUsers();
            }
            
            switchTab('overview');
        }

        // ========== 管理员视图切换 ==========
        function switchAdminView(view) {
            currentView = view;
            selectedStaffId = null;
            document.getElementById('staffSelect').value = '';
            renderAdminViewToggle();
            loadData();
        }

        function renderAdminViewToggle() {
            const isAll = currentView === 'all';
            document.getElementById('btnViewAll').className = isAll 
                ? 'px-3 py-1 rounded-full text-xs font-medium bg-yellow-500 text-black' 
                : 'px-3 py-1 rounded-full text-xs font-medium text-yellow-400 hover:bg-yellow-500/20';
            document.getElementById('btnViewSelf').className = !isAll 
                ? 'px-3 py-1 rounded-full text-xs font-medium bg-yellow-500 text-black' 
                : 'px-3 py-1 rounded-full text-xs font-medium text-yellow-400 hover:bg-yellow-500/20';
        }

        async function loadAllUsers() {
            try {
                allUsers = await supabaseRequest('users', { params: { select: 'id,username', is_admin: 'eq.false' } });
                const select = document.getElementById('staffSelect');
                select.innerHTML = '<option value="">选择客服</option>' + 
                    allUsers.map(u => `<option value="${u.id}">${u.username}</option>`).join('');
            } catch (e) {
                console.error(e);
            }
        }

        function selectStaff(userId) {
            selectedStaffId = userId || null;
            loadData();
        }

        // ========== 数据加载 ==========
        async function loadData() {
            try {
                if (isAdmin && currentView === 'all') {
                    // 管理员查看全部
                    stores = await supabaseRequest('stores', { params: { select: '*' } });
                } else if (isAdmin && selectedStaffId) {
                    // 管理员查看单个客服
                    stores = await supabaseRequest('stores', { params: { user_id: `eq.${selectedStaffId}`, select: '*' } });
                } else {
                    // 普通用户
                    stores = await supabaseRequest('stores', { params: { user_id: `eq.${currentUserId}`, select: '*' } });
                }
                
                const storeIds = stores.map(s => s.id);
                if (storeIds.length > 0) {
                    const ordersRes = await supabaseRequest('orders', { 
                        params: { store_id: `in.(${storeIds.join(',')})`, select: '*' } 
                    });
                    orders = Array.isArray(ordersRes) ? ordersRes : [];
                } else {
                    orders = [];
                }
                
                render();
            } catch (e) {
                console.error('加载数据失败:', e);
                showToast('加载数据失败');
            }
        }

        // ========== 渲染 ==========
        function render() {
            renderStats();
            renderCharts();
            renderTop5();
            renderStoreCards();
            renderStoreTable();
            renderMonthSelect();
            loadRecords();
        }

        function renderStats() {
            let totalProfit = 0, totalRevenue = 0, totalCost = 0, totalOrders = 0;
            
            orders.forEach(o => {
                totalProfit += o.profit || 0;
                totalRevenue += o.revenue || 0;
                totalCost += o.cost || 0;
                totalOrders += o.orders || 0;
            });

            document.getElementById('statTotalProfit').textContent = '¥' + f(totalProfit);
            document.getElementById('statTotalRevenue').textContent = '¥' + f(totalRevenue);
            document.getElementById('statTotalCost').textContent = '¥' + f(totalCost);
            document.getElementById('statTotalOrders').textContent = fmtNum(totalOrders);
            document.getElementById('statTotalStores').textContent = stores.length;
            document.getElementById('statProfitRate').textContent = totalRevenue ? ((totalProfit / totalRevenue) * 100).toFixed(1) + '%' : '0%';
        }

        function renderCharts() {
            // 7天趋势图
            const days = [];
            const profits = [];
            for (let i = 6; i >= 0; i--) {
                const d = new Date();
                d.setDate(d.getDate() - i);
                const dateStr = d.toISOString().split('T')[0];
                days.push(dateStr.slice(5));
                const dayProfit = orders.filter(o => o.date === dateStr).reduce((sum, o) => sum + (o.profit || 0), 0);
                profits.push(dayProfit);
            }

            if (charts.trend) charts.trend.destroy();
            charts.trend = new Chart(document.getElementById('trendChart'), {
                type: 'line',
                data: {
                    labels: days,
                    datasets: [{
                        label: '利润',
                        data: profits,
                        borderColor: '#ff4757',
                        backgroundColor: 'rgba(255,71,87,0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });

            // 饼图
            const storeProfits = stores.map(s => {
                const profit = orders.filter(o => o.store_id === s.id).reduce((sum, o) => sum + (o.profit || 0), 0);
                return { name: s.name, profit };
            }).filter(s => s.profit !== 0).sort((a, b) => b.profit - a.profit).slice(0, 6);

            if (charts.pie) charts.pie.destroy();
            charts.pie = new Chart(document.getElementById('pieChart'), {
                type: 'doughnut',
                data: {
                    labels: storeProfits.map(s => s.name),
                    datasets: [{
                        data: storeProfits.map(s => s.profit),
                        backgroundColor: ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff6b81', '#a55eea']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function renderTop5() {
            const top5 = stores.map(s => {
                const profit = orders.filter(o => o.store_id === s.id).reduce((sum, o) => sum + (o.profit || 0), 0);
                return { ...s, profit };
            }).sort((a, b) => b.profit - a.profit).slice(0, 5);

            document.getElementById('top5List').innerHTML = top5.length ? top5.map((s, i) => `
                <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-white/5 transition">
                    <span class="w-6 h-6 rounded-full ${i === 0 ? 'bg-yellow-500' : i === 1 ? 'bg-gray-400' : i === 2 ? 'bg-amber-600' : 'bg-white/20'} flex items-center justify-center text-xs font-bold">${i + 1}</span>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm truncate">${s.name}</div>
                        <div class="text-xs text-white/50 truncate">${s.product_name || ''}</div>
                    </div>
                    <span class="${s.profit >= 0 ? 'positive' : 'text-green-400'} text-sm font-medium">¥${f(s.profit)}</span>
                </div>
            `).join('') : '<p class="text-white/40 text-sm text-center py-8">暂无数据</p>';
        }

        function renderStoreCards() {
            document.getElementById('storeList').innerHTML = stores.length ? stores.map(s => {
                const todayOrders_ = orders.filter(o => o.store_id === s.id && o.date === today);
                const todayCount = todayOrders_.reduce((sum, o) => sum + (o.orders || 0), 0);
                const totalProfit = orders.filter(o => o.store_id === s.id).reduce((sum, o) => sum + (o.profit || 0), 0);
                const unitProfit = (s.sale_price || 0) - (s.cost_price || 0);

                return `
                    <div class="glass rounded-2xl p-4 store-card transition duration-200 cursor-pointer group" onclick="openOrderModal('${s.id}')">
                        <div class="flex items-start justify-between mb-3">
                            <div>
                                <h4 class="font-medium truncate">${s.name}</h4>
                                <p class="text-xs text-white/50 truncate">${s.product_name || ''}</p>
                            </div>
                            ${!isAdmin ? `
                            <div class="hidden group-hover:flex gap-1">
                                <button onclick="event.stopPropagation(); editStore('${s.id}')" class="p-1.5 bg-white/10 hover:bg-white/20 rounded-lg text-xs transition">✏️</button>
                                <button onclick="event.stopPropagation(); openDeleteStore('${s.id}')" class="p-1.5 bg-white/10 hover:bg-red-500/30 rounded-lg text-xs transition">🗑️</button>
                            </div>
                            ` : ''}
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-sm mb-3">
                            <div class="bg-white/5 rounded-lg p-2">
                                <div class="text-xs text-white/40">卖价</div>
                                <div class="font-medium">¥${s.sale_price || 0}</div>
                            </div>
                            <div class="bg-white/5 rounded-lg p-2">
                                <div class="text-xs text-white/40">成本</div>
                                <div class="font-medium">¥${s.cost_price || 0}</div>
                            </div>
                        </div>
                        <div class="flex items-center justify-between text-sm border-t border-white/10 pt-3">
                            <div>
                                <span class="text-white/40">今日</span>
                                <span class="ml-1">${todayCount}单</span>
                            </div>
                            <span class="${unitProfit >= 0 ? 'positive' : 'text-green-400'} font-medium">¥${f(unitProfit)}/单</span>
                        </div>
                        <div class="flex items-center justify-between text-sm mt-2">
                            <span class="text-white/40">累计利润</span>
                            <span class="${totalProfit >= 0 ? 'positive' : 'text-green-400'} font-bold">¥${f(totalProfit)}</span>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="col-span-full text-white/40 text-sm text-center py-12">暂无店铺，点击右上角添加</p>';
        }

        function renderStoreTable() {
            if (!stores.length) {
                document.getElementById('storeTable').innerHTML = '<p class="text-white/40 text-center py-8">暂无店铺</p>';
                return;
            }

            document.getElementById('storeTable').innerHTML = `
                <table class="w-full text-sm">
                    <thead>
                        <tr class="text-white/60 border-b border-white/10">
                            <th class="text-left py-3 px-2">店铺</th>
                            <th class="text-left py-3 px-2">商品</th>
                            <th class="text-right py-3 px-2">卖价</th>
                            <th class="text-right py-3 px-2">成本</th>
                            <th class="text-right py-3 px-2">利润/单</th>
                            <th class="text-right py-3 px-2">总利润</th>
                            ${!isAdmin ? '<th class="text-right py-3 px-2">操作</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>
                        ${stores.map(s => {
                            const totalProfit = orders.filter(o => o.store_id === s.id).reduce((sum, o) => sum + (o.profit || 0), 0);
                            const unitProfit = (s.sale_price || 0) - (s.cost_price || 0);
                            return `
                                <tr class="border-b border-white/5 hover:bg-white/5">
                                    <td class="py-3 px-2 font-medium">${s.name}</td>
                                    <td class="py-3 px-2 text-white/60">${s.product_name || '-'}</td>
                                    <td class="py-3 px-2 text-right">¥${s.sale_price || 0}</td>
                                    <td class="py-3 px-2 text-right">¥${s.cost_price || 0}</td>
                                    <td class="py-3 px-2 text-right ${unitProfit >= 0 ? 'positive' : 'text-green-400'}">¥${f(unitProfit)}</td>
                                    <td class="py-3 px-2 text-right font-bold ${totalProfit >= 0 ? 'positive' : 'text-green-400'}">¥${f(totalProfit)}</td>
                                    ${!isAdmin ? `
                                    <td class="py-3 px-2 text-right">
                                        <button onclick="openOrderModal('${s.id}')" class="text-pink-400 hover:text-pink-300 mr-2">录订单</button>
                                        <button onclick="editStore('${s.id}')" class="text-blue-400 hover:text-blue-300 mr-2">编辑</button>
                                        <button onclick="openDeleteStore('${s.id}')" class="text-red-400 hover:text-red-300">删除</button>
                                    </td>
                                    ` : ''}
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
        }

        function renderMonthSelect() {
            const months = new Set();
            orders.forEach(o => months.add(o.date.slice(0, 7)));
            const sorted = [...months].sort().reverse();
            
            document.getElementById('monthSelect').innerHTML = sorted.length 
                ? sorted.map(m => `<option value="${m}">${m}</option>`).join('')
                : `<option value="${today.slice(0,7)}">${today.slice(0,7)}</option>`;
        }

        function loadRecords() {
            const month = document.getElementById('monthSelect').value;
            const monthOrders = orders.filter(o => o.date.startsWith(month)).sort((a, b) => b.date.localeCompare(a.date));

            document.getElementById('recordList').innerHTML = monthOrders.length ? monthOrders.map(o => {
                const store = stores.find(s => s.id === o.store_id);
                return `
                    <div class="glass rounded-xl p-4 flex items-center justify-between">
                        <div>
                            <div class="font-medium">${store?.name || '未知店铺'}</div>
                            <div class="text-xs text-white/50">${o.date} · ${o.orders}单</div>
                        </div>
                        <div class="text-right">
                            <div class="${o.profit >= 0 ? 'positive' : 'text-green-400'} font-bold">¥${f(o.profit)}</div>
                            <div class="text-xs text-white/50">营收¥${f(o.revenue)} 成本¥${f(o.cost)}</div>
                        </div>
                    </div>
                `;
            }).join('') : '<p class="text-white/40 text-center py-8">本月暂无订单记录</p>';
        }

        // ========== Tab切换 ==========
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('tab-active', btn.dataset.tab === tab);
                btn.classList.toggle('text-white/60', btn.dataset.tab !== tab);
            });
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
        }

        // ========== 店铺操作 ==========
        function openAddStore() {
            document.getElementById('storeName').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('salePrice').value = '';
            document.getElementById('costPrice').value = '';
            document.getElementById('todayOrders').value = '1';
            openModal('addStoreModal');
        }

        async function saveStore() {
            const name = document.getElementById('storeName').value.trim();
            const productName = document.getElementById('productName').value.trim();
            const salePrice = parseFloat(document.getElementById('salePrice').value) || 0;
            const costPrice = parseFloat(document.getElementById('costPrice').value) || 0;
            const todayOrdersCount = parseInt(document.getElementById('todayOrders').value) || 0;

            if (!name) return showToast('请填写店铺名称');

            try {
                const newStore = await supabaseRequest('stores', {
                    method: 'POST',
                    body: { user_id: currentUserId, name, product_name: productName, sale_price: salePrice, cost_price: costPrice }
                });

                // 如果有今日订单，一并录入
                if (todayOrdersCount > 0) {
                    const profit = (salePrice - costPrice) * todayOrdersCount;
                    await supabaseRequest('orders', {
                        method: 'POST',
                        body: {
                            store_id: newStore[0].id,
                            date: today,
                            orders: todayOrdersCount,
                            revenue: salePrice * todayOrdersCount,
                            cost: costPrice * todayOrdersCount,
                            profit: profit
                        }
                    });
                }

                closeModal('addStoreModal');
                showToast('店铺添加成功！');
                loadData();
            } catch (e) {
                showToast('添加失败');
                console.error(e);
            }
        }

        function editStore(id) {
            const store = stores.find(s => s.id === id);
            if (!store) return;

            document.getElementById('editStoreId').value = id;
            document.getElementById('editStoreName').value = store.name;
            document.getElementById('editProductName').value = store.product_name || '';
            document.getElementById('editSalePrice').value = store.sale_price || 0;
            document.getElementById('editCostPrice').value = store.cost_price || 0;
            openModal('editStoreModal');
        }

        async function updateStore() {
            const id = document.getElementById('editStoreId').value;
            const name = document.getElementById('editStoreName').value.trim();
            const productName = document.getElementById('editProductName').value.trim();
            const salePrice = parseFloat(document.getElementById('editSalePrice').value) || 0;
            const costPrice = parseFloat(document.getElementById('editCostPrice').value) || 0;

            if (!name) return showToast('请填写店铺名称');

            try {
                await supabaseRequest('stores', {
                    method: 'PATCH',
                    params: { id: `eq.${id}` },
                    body: { name, product_name: productName, sale_price: salePrice, cost_price: costPrice }
                });

                closeModal('editStoreModal');
                showToast('修改成功！');
                loadData();
            } catch (e) {
                showToast('修改失败');
                console.error(e);
            }
        }

        function openDeleteStore(id) {
            deleteTarget = { type: 'store', id };
            openModal('deleteModal');
        }

        async function confirmDelete() {
            if (!deleteTarget.id) return;

            try {
                if (deleteTarget.type === 'store') {
                    await supabaseRequest('stores', { method: 'DELETE', params: { id: `eq.${deleteTarget.id}` } });
                    showToast('删除成功');
                }
                closeModal('deleteModal');
                loadData();
            } catch (e) {
                showToast('删除失败');
                console.error(e);
            }
            deleteTarget = { type: null, id: null };
        }

        // ========== 订单操作 ==========
        function openOrderModal(storeId) {
            document.getElementById('orderStoreId').value = storeId;
            document.getElementById('orderDate').value = today;
            document.getElementById('orderCount').value = '1';
            openModal('orderModal');
        }

        async function saveOrder() {
            const storeId = document.getElementById('orderStoreId').value;
            const date = document.getElementById('orderDate').value;
            const orderCount = parseInt(document.getElementById('orderCount').value) || 0;

            const store = stores.find(s => s.id === storeId);
            if (!store) return showToast('店铺不存在');

            const revenue = (store.sale_price || 0) * orderCount;
            const cost = (store.cost_price || 0) * orderCount;
            const profit = revenue - cost;

            try {
                // 检查是否已有当日订单
                const existing = await supabaseRequest('orders', {
                    params: { store_id: `eq.${storeId}`, date: `eq.${date}`, select: 'id' }
                });

                if (existing.length > 0) {
                    // 更新
                    await supabaseRequest('orders', {
                        method: 'PATCH',
                        params: { id: `eq.${existing[0].id}` },
                        body: { orders: orderCount, revenue, cost, profit }
                    });
                } else {
                    // 新增
                    await supabaseRequest('orders', {
                        method: 'POST',
                        body: { store_id: storeId, date, orders: orderCount, revenue, cost, profit }
                    });
                }

                closeModal('orderModal');
                showToast('订单已保存！');
                loadData();
            } catch (e) {
                showToast('保存失败');
                console.error(e);
            }
        }

        // ========== 初始化 ==========
        function init() {
            // 检查登录状态
            const savedUser = localStorage.getItem('pdd_user');
            const savedUserId = localStorage.getItem('pdd_user_id');
            const isAdminSaved = localStorage.getItem('pdd_admin') === 'true';

            if (savedUser && savedUserId) {
                currentUser = savedUser;
                currentUserId = savedUserId;
                isAdmin = false;
                showMainPage();
            } else if (isAdminSaved) {
                currentUser = '管理员';
                isAdmin = true;
                showMainPage();
            } else {
                showLogin();
            }
        }

        init();
    </script>
</body>
</html>
